<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="tank" x1="160" y1="0" x2="300" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Rising bubbles -->
  <circle cx="360" cy="200" r="20" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="393" cy="142" r="13" fill="#ffffff" fill-opacity="0.75"/>
  <circle cx="369" cy="99" r="8" fill="#ffffff" fill-opacity="0.6"/>

  <!-- Valve hand-wheel -->
  <circle cx="230" cy="110" r="30" fill="#1e293b"/>
  <circle cx="230" cy="110" r="13" fill="#64748b"/>
  <!-- Valve neck -->
  <rect x="212" y="120" width="36" height="48" fill="#1e293b"/>
  <!-- DIN outlet port -->
  <rect x="248" y="126" width="44" height="24" rx="8" fill="#334155"/>

  <!-- Cylinder body -->
  <rect x="160" y="160" width="140" height="288" rx="58" fill="url(#tank)"/>

  <!-- Gas-mix marker bands -->
  <rect x="160" y="208" width="140" height="30" fill="#7c3aed"/>
  <rect x="160" y="248" width="140" height="18" fill="#22d3ee"/>

  <!-- Left-edge highlight -->
  <rect x="178" y="182" width="14" height="244" rx="7" fill="#ffffff" fill-opacity="0.6"/>
</svg>
